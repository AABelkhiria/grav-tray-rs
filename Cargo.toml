[package]
name = "grav-tray-rs"
version = "26.7.1"
edition = "2024"
rust-version = "1.85"
authors = ["Ash <belkhiria.achraf@gmail.com>"]
description = "Native macOS menu bar quota monitor for the Google Antigravity CLI"
license = "MIT"
repository = "https://github.com/AABelkhiria/grav-tray-rs"
readme = "README.md"
keywords = ["antigravity", "macos", "menu-bar", "quota", "tray"]
categories = ["command-line-utilities", "gui"]
include = ["Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "src/**"]

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ureq = { version = "2.12.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.175"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[profile.release]
lto = "thin"
strip = true
